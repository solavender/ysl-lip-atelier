name: Deploy YSL Lip Atelier
on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/deploy-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ysl-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare verified website and AR models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/ar-runtime/wasm
          python3 - <<'PYTHON'
          import base64,hashlib,json,pathlib,re
          root=pathlib.Path('_site')
          media=root/'media';media.mkdir(exist_ok=True)
          source=pathlib.Path('index.html').read_text()
          assets={}
          def external(match):
              mime,payload=match.groups();data=base64.b64decode(payload);sha=hashlib.sha256(data).hexdigest()
              suffix={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/svg+xml':'svg'}[mime]
              name=sha[:24]+'.'+suffix;(media/name).write_bytes(data)
              assets[name]={'sha256':sha,'bytes':len(data),'mime':mime}
              return 'media/'+name
          html=re.sub(r'data:(image/[A-Za-z0-9.+-]+);base64,([A-Za-z0-9+/=]+)',external,source)
          assert len(assets)>=30
          assert not re.search(r'data:image/[^;]+;base64,',html)
          (root/'index.html').write_text(html)
          (root/'media-manifest.json').write_text(json.dumps(assets,indent=2))
          print('Online HTML bytes:',len(html.encode()),'Original source preserved; unique image files:',len(assets))
          PYTHON
          touch _site/.nojekyll
          package='@mediapipe/tasks-vision@0.10.21'
          for file in vision_bundle.mjs wasm/vision_wasm_internal.js wasm/vision_wasm_internal.wasm wasm/vision_wasm_nosimd_internal.js wasm/vision_wasm_nosimd_internal.wasm; do
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 "https://cdn.jsdelivr.net/npm/$package/$file" -o "_site/ar-runtime/$file" || curl -fLsS --retry 3 --max-time 120 "https://unpkg.com/$package/$file" -o "_site/ar-runtime/$file"
          done
          curl -fLsS --retry 3 --max-time 120 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' -o _site/ar-runtime/face_landmarker.task
          curl -fLsS --retry 3 --max-time 60 'https://raw.githubusercontent.com/google-ai-edge/mediapipe/v0.10.21/LICENSE' -o _site/ar-runtime/LICENSE
          sha256sum -c <<'CHECKSUMS'
          40f4123dfcd75cfa58add046919cc6f52fde66f009ff582997c09ba54c6ba27c  _site/ar-runtime/vision_bundle.mjs
          4a97e2520ba506c680ecd6ba6acfb146888afa0e2746d57f205352bc6ebb82eb  _site/ar-runtime/wasm/vision_wasm_internal.js
          f00ec4731faa23b3e714d00e88d4d10e2df5c0a427d3a2b4ae6e3526fdd14ef7  _site/ar-runtime/wasm/vision_wasm_internal.wasm
          927def7b465c51b86e4b3060f93646aca4e27121f4b8fc0483786e407ea9cf1f  _site/ar-runtime/wasm/vision_wasm_nosimd_internal.js
          3821ea9b1f7fb8c549ef2a064ef5c85750bf375c545a49fd6eea0df44a95f1f4  _site/ar-runtime/wasm/vision_wasm_nosimd_internal.wasm
          64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  _site/ar-runtime/face_landmarker.task
          8707eef0533987efc5b155d64761eeb6e20793f50b9bd1a68dad1cf4719d0ed8  _site/ar-runtime/LICENSE
          CHECKSUMS
          echo '{"version":"0.10.21"}' > _site/ar-runtime/manifest.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTTPS website
        id: deployment
        uses: actions/deploy-pages@v4
